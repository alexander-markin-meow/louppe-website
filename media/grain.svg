<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncR type="gamma" amplitude="1" exponent="2.1" offset="0"/><feFuncG type="gamma" amplitude="1" exponent="2.1" offset="0"/><feFuncB type="gamma" amplitude="1" exponent="2.1" offset="0"/></feComponentTransfer>
  </filter>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
